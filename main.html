<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>Car Insurance Registration Form</title>
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" required>

		<label for="email">Email</label>
		<input type="email" id="email" required>

		<label for="gender">Gender</label>
		<input type="radio" id="gender" name="gender" value="male">male
		<input type="radio" id="gender" name="gender" value="female">female
<br>
		<label for="cars">Cars Brands</label>
		<select>
		<option id="cars">BMW</option>
	    <option id="cars">Audi</option>
		<option id="cars">Mercedez</option>
		</select>
<br>

		<label for="carage">Car Age</label>
		<input type="number" id="carage" required>

		<label for="dop">Date of Purchase</label>
		<input type="text" id="dop" required>

		<label for="password">Password</label>
		<input type="password" id="password" required>

		<button type="submit">Submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
